{% extends "base.html" %}

{% block title %}Профиль — YouTube MVP{% endblock %}

{% block content %}
<style>
    .profile-header {
        display: flex; gap: 24px; align-items: flex-start;
        padding: 32px 24px; border-bottom: 1px solid #3f3f3f;
        background: #0f0f0f;
    }
    .profile-avatar {
        width: 160px; height: 160px; border-radius: 50%;
        background: #c2185b; color: #fff;
        display: flex; align-items: center; justify-content: center;
        font-size: 72px; font-weight: bold; flex-shrink: 0;
    }
    .profile-info h1 { margin: 0 0 8px; font-size: 36px; }
    .profile-info .meta { color: #aaa; font-size: 14px; margin-bottom: 8px; }
    .profile-info .desc { color: #ccc; font-size: 14px; margin-bottom: 16px; }
    .profile-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .profile-actions button {
        background: #272727; color: #fff; border: none;
        padding: 10px 16px; border-radius: 18px; cursor: pointer;
        font-weight: 500; font-size: 14px;
    }
    .profile-actions button:hover { background: #3f3f3f; }
    .profile-actions button.primary { background: #fff; color: #000; }
    .profile-actions button.danger { background: #7a1f1f; }

    .profile-tabs {
        display: flex; gap: 24px; padding: 0 24px;
        border-bottom: 1px solid #3f3f3f; background: #0f0f0f;
    }
    .profile-tabs .tab {
        padding: 16px 0; cursor: pointer; color: #aaa;
        font-weight: 500; border-bottom: 2px solid transparent;
    }
    .profile-tabs .tab.active { color: #fff; border-bottom-color: #fff; }

    .profile-content { padding: 24px; }
    .empty-state {
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; text-align: center; padding: 80px 20px;
        color: #aaa;
    }
    .empty-state .emoji { font-size: 64px; margin-bottom: 16px; }
    .empty-state h3 { color: #fff; margin: 0 0 8px; }
    .empty-state p { max-width: 420px; line-height: 1.5; margin: 0 0 20px; }
    .empty-state .btn-create {
        background: #fff; color: #000; border: none;
        padding: 10px 20px; border-radius: 18px; font-weight: 500; cursor: pointer;
    }

    .video-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 20px;
    }
    .video-card {
        background: #1a1a1a; border-radius: 10px; overflow: hidden;
        cursor: pointer; transition: transform 0.15s; position: relative;
    }
    .video-card:hover { transform: translateY(-3px); }
    .video-card .thumb {
        width: 100%; aspect-ratio: 16/9; background: #272727;
        display: flex; align-items: center; justify-content: center;
        color: #555; font-size: 40px;
    }
    .video-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .video-card .info { padding: 10px 12px; }
    .video-card .info h4 { margin: 0 0 4px; font-size: 15px; color: #fff; }
    .video-card .info .sub { font-size: 12px; color: #aaa; }
    .video-card .private-badge {
        position: absolute; top: 8px; right: 8px;
        background: rgba(0,0,0,0.75); color: #ffd166;
        font-size: 11px; padding: 3px 8px; border-radius: 10px;
        display: flex; align-items: center; gap: 4px;
    }

    /* Модалка управления приватностью */
    .privacy-row {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 0; border-bottom: 1px solid #3f3f3f;
        gap: 12px;
    }
    .privacy-row:last-child { border-bottom: none; }
    .privacy-row .title { font-size: 14px; color: #fff; flex: 1; min-width: 0; }
    .privacy-row .title small { display: block; color: #888; font-size: 11px; }
    .privacy-row label { display: flex; align-items: center; gap: 6px; color: #ccc; font-size: 13px; }
    .privacy-list { max-height: 360px; overflow-y: auto; margin-bottom: 16px; }
    .privacy-empty { color: #888; text-align: center; padding: 24px 0; font-size: 14px; }
</style>

<div id="profile-root">
    <div class="empty-state">
        <div class="emoji">⏳</div>
        <p>Загрузка профиля…</p>
    </div>
</div>

<!-- ================= МОДАЛКА УПРАВЛЕНИЯ ПРИВАТНОСТЬЮ ================= -->
<div id="privacy-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 600px;">
        <div class="modal-header">
            <h2>Управление видео</h2>
            <button class="icon-btn" onclick="closePrivacyModal()"><i class="ph ph-x"></i></button>
        </div>
        <div class="modal-body">
            <div class="privacy-list" id="privacy-list">
                <div class="privacy-empty">Загрузка…</div>
            </div>
            <button class="btn-primary" id="privacy-save-btn" onclick="savePrivacyChanges()">
                Сохранить изменения
            </button>
        </div>
    </div>
</div>
<div id="access-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 520px;">
        <div class="modal-header">
            <h2 id="access-modal-title">Доступ к видео</h2>
            <button class="icon-btn" onclick="closeAccessModal()"><i class="ph ph-x"></i></button>
        </div>
        <div class="modal-body">
            <p style="color:#aaa; font-size:13px; margin-bottom:12px;">
                Приватное видео видно только вам и пользователям из списка.
            </p>
            <div id="access-list" style="margin-bottom:16px;"></div>
            <div style="display:flex; gap:8px;">
                <input id="access-email-input" type="text" placeholder="Email пользователя..."
                       style="flex:1; background:#272727; border:1px solid #3f3f3f; border-radius:8px; color:#fff; padding:8px 12px;">
                <button class="btn-primary" onclick="grantAccess()">Добавить</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const token = localStorage.getItem('token');
// null = свой ЛК; число = публичная страница чужого канала (из маршрута /profile/{id})
const PUBLIC_ID = {{ profile_user_id | default(none) | tojson }};

let currentUser = null;
let currentVideos = [];
let privacyDraft = {};
let activeTab = 'home';

/* ---------- Утилиты ---------- */

function getAuthHeaders(extra) {
    return Object.assign({}, token ? { 'Authorization': `Bearer ${token}` } : {}, extra || {});
}

function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
}

function plural(n, one, few, many) {
    n = Math.abs(Number(n) || 0) % 100;
    const n1 = n % 10;
    if (n > 10 && n < 20) return many;
    if (n1 > 1 && n1 < 5) return few;
    if (n1 === 1) return one;
    return many;
}

function fmtCount(n, one, few, many) {
    n = Number(n) || 0;
    return `${n} ${plural(n, one, few, many)}`;
}

function formatDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return isNaN(d.getTime()) ? String(iso) : d.toLocaleDateString('ru-RU');
}

function emptyState(emoji, title, text, btnHtml = '') {
    return `
        <div class="empty-state">
            <div class="emoji">${emoji}</div>
            ${title ? `<h3>${title}</h3>` : ''}
            <p>${text}</p>
            ${btnHtml}
        </div>`;
}

/* ---------- Загрузка ---------- */

async function loadProfile() {
    if (PUBLIC_ID) return loadPublicChannel(PUBLIC_ID);

    const root = document.getElementById('profile-root');
    if (!token) {
        root.innerHTML = emptyState('🔒', 'Войдите в аккаунт',
            'Чтобы открыть личный кабинет, нужно авторизоваться.',
            `<button class="btn-create" onclick="document.getElementById('login-modal').style.display='flex'">Войти</button>`);
        return;
    }

    try {
        const res = await fetch('/profile/me', { headers: getAuthHeaders() });
        if (res.status === 401 || res.status === 403) {
            root.innerHTML = emptyState('🔒', 'Сессия истекла', 'Войдите в аккаунт заново.',
                `<button class="btn-create" onclick="forceLogout('/login')">Войти</button>`);
            return;
        }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        currentUser = await res.json();

        const videosRes = await fetch(`/profile/${currentUser.id}/videos`, { headers: getAuthHeaders() });
        if (!videosRes.ok) console.error('Не удалось загрузить видео:', videosRes.status);
        currentVideos = videosRes.ok ? await videosRes.json() : [];

        renderOwnProfile();
    } catch (e) {
        console.error('Ошибка загрузки профиля:', e);
        root.innerHTML = emptyState('⚠️', 'Не удалось загрузить профиль',
            'Проверьте соединение или войдите заново.',
            `<button class="btn-create" onclick="loadProfile()">Повторить</button>`);
    }
}

function renderOwnProfile() {
    const root = document.getElementById('profile-root');
    const email = currentUser.email || '';
    const username = escapeHtml(email ? email.split('@')[0] : 'user');
    const letter = escapeHtml((email || 'U').charAt(0).toUpperCase());
    const videosCount = currentUser.videos_count ?? currentVideos.length;

    root.innerHTML = `
        <div class="profile-header">
            <div class="profile-avatar">${letter}</div>
            <div class="profile-info">
                <h1>${username}</h1>
                <div class="meta">
                    @${username} ·
                    ${fmtCount(currentUser.subscribers_count, 'подписчик', 'подписчика', 'подписчиков')} ·
                    ${fmtCount(currentUser.subscriptions_count, 'подписка', 'подписки', 'подписок')} ·
                    ${videosCount} видео
                </div>
                <div class="desc">
                    Канал пользователя. Роль: ${escapeHtml(currentUser.role)}.
                    На платформе с ${formatDate(currentUser.created_at)}.
                </div>
                <div class="profile-actions">
                    <button class="primary" onclick="document.getElementById('upload-modal').style.display='flex'">Создать</button>
                    <button onclick="editProfile()">Сменить email</button>
                    <button onclick="openPrivacyModal()">Управление видео</button>
                    <button class="danger" onclick="doLogout()">Выйти</button>
                </div>
            </div>
        </div>

        <div class="profile-tabs">
            <div class="tab active" data-tab="home">Главная</div>
            <div class="tab" data-tab="videos">Записи</div>
            <div class="tab" data-tab="subscriptions">Подписки</div>
        </div>

        <div class="profile-content" id="profile-tab-content"></div>
    `;

    document.querySelectorAll('.profile-tabs .tab').forEach(tab => {
        tab.addEventListener('click', () => {
            activeTab = tab.dataset.tab;
            document.querySelectorAll('.profile-tabs .tab').forEach(t => t.classList.toggle('active', t === tab));
            renderTab(activeTab);
        });
    });

    activeTab = 'home';
    renderTab('home');
}

/* ---------- Вкладки (async — потому что внутри есть await) ---------- */

async function renderTab(tab) {
    const contentEl = document.getElementById('profile-tab-content');
    if (!contentEl) return;

    if (tab === 'home') {
        if (currentVideos.length === 0) {
            contentEl.innerHTML = emptyState('🎬', 'Здесь будет ваш контент',
                'Создавайте и загружайте контент из дома или любой точки мира. Все ваши общедоступные видео будут показываться здесь.',
                `<button class="btn-create" onclick="document.getElementById('upload-modal').style.display='flex'">Создать</button>`);
            return;
        }
        const pub = currentVideos.filter(v => !v.is_private);
        if (!pub.length) {
            contentEl.innerHTML = emptyState('🔒', '', 'Все ваши видео приватные. Переключитесь на вкладку «Записи» или измените приватность.');
            return;
        }
        contentEl.innerHTML = `<div class="video-grid">${pub.map(videoCard).join('')}</div>`;
        bindVideoCards(contentEl);

    } else if (tab === 'videos') {
        if (currentVideos.length === 0) {
            contentEl.innerHTML = emptyState('📭', '', 'У вас пока нет загруженных видео.');
            return;
        }
        contentEl.innerHTML = `<div class="video-grid">${currentVideos.map(videoCard).join('')}</div>`;
        bindVideoCards(contentEl);

    } else if (tab === 'subscriptions') {
        await renderSubscriptions(contentEl);
    }
}

async function renderSubscriptions(contentEl) {
    contentEl.innerHTML = emptyState('⏳', '', 'Загрузка подписок…');
    try {
        const r = await fetch('/subscriptions/my', { headers: getAuthHeaders() });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const subs = await r.json();

        if (!subs.length) {
            contentEl.innerHTML = emptyState('👥', 'Вы ни на кого не подписаны',
                'Подпишитесь на каналы на странице видео — они появятся здесь.');
            return;
        }
        contentEl.innerHTML = `<div class="video-grid">${subs.map(channelCard).join('')}</div>`;
    } catch (e) {
        console.error('Ошибка загрузки подписок:', e);
        contentEl.innerHTML = emptyState('⚠️', '', 'Не удалось загрузить подписки.');
    }
}

/* ---------- Карточки ---------- */

function videoCard(v) {
    const badge = v.is_private
        ? `<div class="private-badge"><i class="ph ph-lock-simple"></i> Приватное</div>`
        : '';
    const thumb = v.thumbnail_path
        ? `<img src="${escapeHtml(v.thumbnail_path)}" alt="">`
        : '🎞️';
    return `
        <div class="video-card" data-id="${Number(v.id)}">
            <div class="thumb">${thumb}</div>
            ${badge}
            <div class="info">
                <h4>${escapeHtml(v.title)}</h4>
                <div class="sub">
                    ${fmtCount(v.views, 'просмотр', 'просмотра', 'просмотров')} ·
                    ${fmtCount(v.likes_count, 'лайк', 'лайка', 'лайков')}
                </div>
            </div>
        </div>`;
}

function channelCard(s) {
    const email = s.email || '';
    const name = escapeHtml(email ? email.split('@')[0] : `Канал #${s.id}`);
    const letter = escapeHtml((email || 'U').charAt(0).toUpperCase());
    return `
        <div class="video-card" onclick="window.location.href='/profile/${Number(s.id)}'">
            <div class="thumb">${letter}</div>
            <div class="info">
                <h4>${name}</h4>
                <div class="sub">
                    ${fmtCount(s.subscribers_count, 'подписчик', 'подписчика', 'подписчиков')} ·
                    ${Number(s.videos_count) || 0} видео
                </div>
            </div>
        </div>`;
}

// Привязка кликов только к карточкам видео внутри указанного контейнера
function bindVideoCards(scope) {
    scope.querySelectorAll('.video-card[data-id]').forEach(card => {
        card.addEventListener('click', () => {
            window.location.href = `/video?id=${card.dataset.id}`;
        });
    });
}

/* ---------- Публичная страница канала ---------- */

async function loadPublicChannel(id) {
    const root = document.getElementById('profile-root');
    try {
        const headers = getAuthHeaders();
        const [infoR, vidsR] = await Promise.all([
            fetch(`/subscriptions/channel/${id}`, { headers }),
            fetch(`/profile/${id}/videos`, { headers }),
        ]);
        if (!infoR.ok) console.error('Инфо о канале недоступно:', infoR.status);
        const info = infoR.ok ? await infoR.json() : {};

        let vids = vidsR.ok ? await vidsR.json() : [];
        // Клиентская защита; сервер ОБЯЗАН сам отдавать только публичные видео чужого канала
        vids = vids.filter(v => !v.is_private);
        currentVideos = vids;

        const email = info.email || '';
        const username = escapeHtml(email ? email.split('@')[0] : `Канал #${id}`);
        const letter = escapeHtml((email || 'U').charAt(0).toUpperCase());

        root.innerHTML = `
            <div class="profile-header">
                <div class="profile-avatar">${letter}</div>
                <div class="profile-info">
                    <h1>${username}</h1>
                    <div class="meta">
                        @${username} ·
                        ${fmtCount(info.subscribers_count, 'подписчик', 'подписчика', 'подписчиков')} ·
                        ${vids.length} видео
                    </div>
                    <div class="profile-actions" id="pub-actions"></div>
                </div>
            </div>
            <div class="profile-content">
                ${vids.length
                    ? `<div class="video-grid">${vids.map(videoCard).join('')}</div>`
                    : emptyState('📭', '', 'На этом канале пока нет публичных видео.')}
            </div>`;
        bindVideoCards(root);

        const actions = document.getElementById('pub-actions');
        if (info.is_own_channel) {
            actions.innerHTML = `<button class="primary" onclick="window.location.href='/profile'">Это ваш канал — открыть ЛК</button>`;
            return;
        }
        const btn = document.createElement('button');
        btn.className = 'primary';
        const setSub = f => { btn.textContent = f ? 'Вы подписаны' : 'Подписаться'; };
        setSub(!!info.is_subscribed);
        btn.onclick = async () => {
            if (!token) return alert('Войдите, чтобы подписаться');
            try {
                const r = await fetch(`/subscriptions/${id}/toggle`, { method: 'POST', headers: getAuthHeaders() });
                if (!r.ok) return alert(r.status === 401 ? 'Войдите заново' : 'Не удалось изменить подписку');
                const data = await r.json();
                setSub(!!data.is_subscribed);
            } catch (err) {
                console.error(err);
                alert('Ошибка сети');
            }
        };
        actions.appendChild(btn);
    } catch (e) {
        console.error('Ошибка загрузки канала:', e);
        root.innerHTML = emptyState('⚠️', 'Не удалось загрузить канал', 'Проверьте соединение и попробуйте снова.',
            `<button class="btn-create" onclick="loadPublicChannel(${Number(id)})">Повторить</button>`);
    }
}

/* ---------- Управление приватностью ---------- */

function openPrivacyModal() {
    if (!currentVideos.length) {
        alert('У вас пока нет видео для управления.');
        return;
    }
    privacyDraft = {};
    currentVideos.forEach(v => { privacyDraft[v.id] = !!v.is_private; });
    renderPrivacyList();
    document.getElementById('privacy-modal').style.display = 'flex';
}

function closePrivacyModal() {
    document.getElementById('privacy-modal').style.display = 'none';
}

function renderPrivacyList() {
    const list = document.getElementById('privacy-list');
    if (!currentVideos.length) {
        list.innerHTML = `<div class="privacy-empty">Нет видео.</div>`;
        return;
    }
 list.innerHTML = currentVideos.map(v => `
    <div class="privacy-row">
        <div class="title">
            ${escapeHtml(v.title)}
            <small>${fmtCount(v.views, 'просмотр', 'просмотра', 'просмотров')} · ${fmtCount(v.likes_count, 'лайк', 'лайка', 'лайков')}</small>
        </div>
        <button class="icon-btn" title="Настроить доступ" onclick="openAccessModal(${Number(v.id)})">
            <i class="ph ph-user-plus"></i>
        </button>
        <label>
            <input type="checkbox" data-id="${Number(v.id)}"
                ${privacyDraft[v.id] ? 'checked' : ''}
                onchange="onPrivacyToggle(${Number(v.id)}, this.checked)">
            Приватное
        </label>
    </div>
`).join('');
}

function onPrivacyToggle(id, checked) {
    privacyDraft[id] = checked;
}

async function savePrivacyChanges() {
    const btn = document.getElementById('privacy-save-btn');
    btn.disabled = true;
    btn.textContent = 'Сохранение…';

    const changed = currentVideos.filter(v => privacyDraft[v.id] !== !!v.is_private);
    if (!changed.length) {
        btn.disabled = false;
        btn.textContent = 'Сохранить изменения';
        closePrivacyModal();
        return;
    }

    try {
        for (const v of changed) {
            const res = await fetch(`/videos/${v.id}`, {
                method: 'PATCH',
                headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({ is_private: privacyDraft[v.id] }),
            });
            if (!res.ok) throw new Error(`не удалось обновить видео ${v.id} (HTTP ${res.status})`);
            v.is_private = privacyDraft[v.id];
        }
        alert('Приватность обновлена.');
        closePrivacyModal();
        renderTab(activeTab);
    } catch (e) {
        console.error(e);
        alert('Ошибка при сохранении: ' + e.message);
    } finally {
        btn.disabled = false;
        btn.textContent = 'Сохранить изменения';
    }
}

/* ---------- Аккаунт ---------- */

function editProfile() {
    if (!currentUser) return;
    const next = prompt('Новый email (логин):', currentUser.email || '');
    if (!next) return;
    const email = next.trim();
    if (!email || email === currentUser.email) return;

    fetch('/profile/me', {
        method: 'PATCH',
        headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ email }),
    }).then(async (r) => {
        if (r.ok) {
            // JWT выпущен на старый email (sub=email) -> он станет недействителен
            alert('Email изменён. Войдите заново с новым email.');
            forceLogout('/login');
        } else {
            const err = await r.json().catch(() => ({}));
            alert('Ошибка: ' + (typeof err.detail === 'string' ? err.detail : 'не удалось обновить'));
        }
    }).catch(() => alert('Ошибка сети'));
}

function forceLogout(target = '/') {
    localStorage.removeItem('token');
    localStorage.removeItem('user_name');
    window.location.href = target;
}

function doLogout() {
    if (confirm('Выйти из аккаунта?')) forceLogout('/');
}
let accessVideoId = null;

async function openAccessModal(videoId) {
    accessVideoId = videoId;
    const v = currentVideos.find(x => x.id === videoId);
    document.getElementById('access-modal-title').textContent = 'Доступ: ' + (v ? v.title : '');
    document.getElementById('access-email-input').value = '';
    document.getElementById('access-modal').style.display = 'flex';
    await loadAccessList();
}

function closeAccessModal() {
    document.getElementById('access-modal').style.display = 'none';
    accessVideoId = null;
}

async function loadAccessList() {
    const list = document.getElementById('access-list');
    list.innerHTML = '<p style="color:#888;">Загрузка…</p>';
    try {
        const r = await fetch(`/videos/${accessVideoId}/access`, { headers: getAuthHeaders() });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const users = await r.json();
        if (!users.length) {
            list.innerHTML = '<p style="color:#888;">Никому не разрешено — видео видите только вы.</p>';
            return;
        }
        list.innerHTML = users.map(u => `
            <div class="privacy-row">
                <div class="title">${escapeHtml(u.email)}</div>
                <button class="icon-btn" title="Убрать доступ" onclick="revokeAccess(${Number(u.user_id)})">
                    <i class="ph ph-x"></i>
                </button>
            </div>`).join('');
    } catch (e) {
        console.error(e);
        list.innerHTML = '<p style="color:#ff4e45;">Не удалось загрузить список.</p>';
    }
}

async function grantAccess() {
    const input = document.getElementById('access-email-input');
    const email = input.value.trim();
    if (!email) return;
    try {
        const r = await fetch(`/videos/${accessVideoId}/access`, {
            method: 'POST',
            headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({ email })
        });
        if (r.ok) { input.value = ''; await loadAccessList(); }
        else {
            const err = await r.json().catch(() => ({}));
            alert('Ошибка: ' + (typeof err.detail === 'string' ? err.detail : 'не удалось добавить'));
        }
    } catch (e) { console.error(e); alert('Ошибка сети'); }
}

async function revokeAccess(userId) {
    if (!confirm('Убрать доступ у этого пользователя?')) return;
    try {
        const r = await fetch(`/videos/${accessVideoId}/access/${userId}`, {
            method: 'DELETE', headers: getAuthHeaders()
        });
        if (r.ok) await loadAccessList();
        else alert('Не удалось убрать доступ');
    } catch (e) { console.error(e); alert('Ошибка сети'); }
}

document.getElementById('access-modal').addEventListener('click', (e) => {
    if (e.target.id === 'access-modal') closeAccessModal();
});

/* ---------- Инициализация ---------- */

document.getElementById('privacy-modal').addEventListener('click', (e) => {
    if (e.target.id === 'privacy-modal') closePrivacyModal();
});

loadProfile();
</script>
