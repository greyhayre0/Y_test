{% extends "base.html" %}

{% block title %}Модерация — YouTube MVP{% endblock %}

{% block content %}
<style>
    .mod-container { max-width: 900px; margin: 0 auto; padding: 24px; }
    .mod-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .mod-header h1 { font-size: 24px; margin: 0; }
    .mod-header .count { color: var(--text-muted, #aaa); font-size: 14px; }
    .report-card { background: #1a1a1a; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .report-card .top { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
    .report-card .video-link { color: #3ea6ff; text-decoration: none; font-weight: 600; font-size: 15px; }
    .report-card .video-link:hover { text-decoration: underline; }
    .report-card .meta { color: #aaa; font-size: 12px; }
    .report-card .reason { background: #272727; border-radius: 8px; padding: 10px 12px; font-size: 14px; margin: 10px 0; white-space: pre-wrap; line-height: 1.4; }
    .report-card .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .report-card .actions button { border: none; padding: 8px 16px; border-radius: 18px; cursor: pointer; font-weight: 500; font-size: 13px; }
    .btn-approve { background: #7a1f1f; color: #fff; }
    .btn-approve:hover { background: #9a2727; }
    .btn-reject { background: #272727; color: #fff; }
    .btn-reject:hover { background: #3f3f3f; }
    .mod-empty { text-align: center; color: #aaa; padding: 80px 20px; }
    .mod-empty .emoji { font-size: 64px; margin-bottom: 16px; }
    .mod-empty h3 { color: #fff; margin: 0 0 8px; }
</style>

<div class="mod-container" id="mod-root">
    <div class="mod-empty"><div class="emoji">⏳</div><p>Загрузка…</p></div>
</div>
{% endblock %}

{% block scripts %}
<script>
const token = localStorage.getItem('token');

function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
}
function fmtDate(iso) { return iso ? new Date(iso).toLocaleString('ru-RU') : ''; }
function headers() { return token ? { 'Authorization': `Bearer ${token}` } : {}; }

function emptyState(emoji, title, text) {
    return `<div class="mod-empty"><div class="emoji">${emoji}</div>${title ? `<h3>${title}</h3>` : ''}<p>${text}</p></div>`;
}

async function init() {
    const root = document.getElementById('mod-root');
    if (!token) {
        root.innerHTML = emptyState('🔒', 'Войдите в аккаунт', 'Страница модерации доступна только авторизованным модераторам и администраторам.');
        return;
    }
    try {
        const me = await fetch('/profile/me', { headers: headers() });
        if (!me.ok) throw new Error(`HTTP ${me.status}`);
        const user = await me.json();

        if (!['moderator', 'admin'].includes(user.role)) {
            root.innerHTML = emptyState('⛔', 'Доступ запрещён', 'Эта страница только для модераторов и администраторов.');
            return;
        }

        root.innerHTML = `
            <div class="mod-header">
                <h1>Жалобы на видео</h1>
                <span class="count" id="reports-count"></span>
            </div>
            <div id="reports-list"></div>`;
        await loadReports();
    } catch (e) {
        console.error(e);
        root.innerHTML = emptyState('⚠️', 'Не удалось загрузить', 'Проверьте соединение или войдите заново.');
    }
}

async function loadReports() {
    const list = document.getElementById('reports-list');
    const countEl = document.getElementById('reports-count');
    try {
        const r = await fetch('/reports/pending', { headers: headers() });
        if (r.status === 403) {
            document.getElementById('mod-root').innerHTML = emptyState('⛔', 'Доступ запрещён', 'Недостаточно прав.');
            return;
        }
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const reports = await r.json();

        countEl.textContent = `Активных: ${reports.length}`;
        if (!reports.length) {
            list.innerHTML = emptyState('✅', 'Всё чисто', 'Активных жалоб нет.');
            return;
        }
        list.innerHTML = reports.map(reportCard).join('');
    } catch (e) {
        console.error(e);
        list.innerHTML = emptyState('⚠️', '', 'Не удалось загрузить жалобы.');
    }
}

function reportCard(r) {
    const title = escapeHtml(r.video_title || 'Видео');
    const video = r.video_id
        ? `<a class="video-link" href="/video?id=${Number(r.video_id)}" target="_blank">${title}</a>`
        : `<span class="video-link">${title} (уже удалено)</span>`;
    return `
        <div class="report-card" id="report-${Number(r.id)}">
            <div class="top">
                ${video}
                <span class="meta">${fmtDate(r.created_at)}</span>
            </div>
            <div class="meta">От: ${escapeHtml(r.reporter_email)}</div>
            <div class="reason">${escapeHtml(r.reason)}</div>
            <div class="actions">
                <button class="btn-approve" onclick="decide(${Number(r.id)}, 'approve')">
                    <i class="ph ph-trash"></i> Одобрить — удалить видео
                </button>
                <button class="btn-reject" onclick="decide(${Number(r.id)}, 'reject')">Отклонить</button>
            </div>
        </div>`;
}

async function decide(id, action) {
    if (action === 'approve' &&
        !confirm('Одобрить жалобу? Видео, его комментарии и лайки будут удалены безвозвратно.')) return;
    try {
        const res = await fetch(`/reports/${id}/${action}`, { method: 'POST', headers: headers() });
        if (res.ok) {
            await loadReports();
        } else if (res.status === 403) {
            alert('Недостаточно прав');
        } else if (res.status === 400) {
            alert('Жалоба уже обработана');
            await loadReports();
        } else if (res.status === 401) {
            alert('Войдите заново');
        } else {
            alert('Не удалось обработать жалобу');
        }
    } catch (e) { console.error(e); alert('Ошибка сети'); }
}

init();
</script>
{% endblock %}
