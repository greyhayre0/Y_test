{% extends "base.html" %}

{% block title %}Смотреть видео - YouTube MVP{% endblock %}

{% block content %}
<style>
    /* Дополнительные стили для страницы видео */
    .video-page-container { display: flex; gap: 24px; max-width: 1400px; margin: 0 auto; }
    .primary-column { flex: 1; min-width: 0; }
    .secondary-column { width: 380px; flex-shrink: 0; }

    .player-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
    .player-wrapper video { width: 100%; height: 100%; }

    .video-title { font-size: 20px; font-weight: bold; margin-bottom: 12px; line-height: 1.3; }

    .video-actions-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    .channel-info { display: flex; align-items: center; gap: 12px; }
    .channel-info .channel-avatar { width: 40px; height: 40px; }
    .channel-text h4 { font-size: 16px; margin-bottom: 2px; }
    .channel-text p { font-size: 12px; color: var(--text-muted); }

    .subscribe-btn { background: var(--text-main); color: var(--bg-main); border: none; padding: 10px 16px; border-radius: 20px; font-weight: 500; cursor: pointer; margin-left: 12px; }
    .subscribe-btn:hover { background: #d9d9d9; }
    .subscribe-btn.subscribed { background: var(--bg-chip); color: var(--text-main); }
    .subscribe-btn.subscribed:hover { background: #3f3f3f; }

    .actions-group { display: flex; gap: 8px; }
    .action-btn { display: flex; align-items: center; gap: 6px; background: var(--bg-chip); color: var(--text-main); border: none; padding: 8px 16px; border-radius: 20px; font-weight: 500; cursor: pointer; }
    .action-btn:hover { background: #3f3f3f; }
    .action-btn i { font-size: 18px; }
    .action-btn.active { background: #3ea6ff; color: #0f0f0f; }

    .description-box { background: var(--bg-chip); padding: 12px 16px; border-radius: 12px; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
    .description-box .stats { margin-bottom: 8px; color: var(--text-main); font-weight: bold; }

    /* Комментарии */
    .comments-section { margin-top: 24px; padding-bottom: 50px; }
    .comments-header { font-size: 20px; font-weight: bold; margin-bottom: 24px; }
    .add-comment { display: flex; gap: 16px; margin-bottom: 32px; }
    .add-comment input { flex: 1; background: transparent; border: none; border-bottom: 1px solid var(--border-color); color: var(--text-main); padding: 8px 0; font-size: 14px; outline: none; }
    .add-comment input:focus { border-bottom-color: var(--text-main); }

    .comment-item { display: flex; gap: 16px; margin-bottom: 20px; }
    .comment-content { flex: 1; }
    .comment-header { font-size: 13px; margin-bottom: 4px; }
    .comment-header .author { font-weight: bold; margin-right: 8px; }
    .comment-header .date { color: var(--text-muted); }
    .comment-text { font-size: 14px; line-height: 1.4; white-space: pre-wrap; }

    /* Рекомендации */
    .recommendation-item { display: flex; gap: 8px; margin-bottom: 12px; cursor: pointer; text-decoration: none; color: inherit; }
    .recommendation-item .thumbnail { width: 168px; flex-shrink: 0; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: #222; }
    .recommendation-item .thumbnail img { width: 100%; height: 100%; object-fit: cover; }
    .rec-info { flex: 1; }
    .rec-info h4 { font-size: 14px; font-weight: 500; line-height: 1.3; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .rec-info p { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
</style>

<div class="video-page-container">
    <!-- ЛЕВАЯ КОЛОНКА (Плеер и Комментарии) -->
    <div class="primary-column">

        <!-- Плеер -->
        <div class="player-wrapper">
            <video id="video-player" controls></video>
        </div>

        <!-- Заголовок -->
        <h1 class="video-title" id="video-title">Загрузка...</h1>

        <!-- Канал и действия -->
        <div class="video-actions-row">
            <div class="channel-info">
                <div class="channel-avatar" id="channel-avatar"></div>
                <div class="channel-text">
                    <h4 id="channel-name">Автор</h4>
                    <p id="channel-subs">0 подписчиков</p>
                </div>
                <button class="subscribe-btn" id="subscribe-btn" style="display:none;">Подписаться</button>
            </div>

            <div class="actions-group">
                <button class="action-btn" id="like-btn"><i class="ph ph-thumbs-up"></i> <span id="like-count">0</span></button>
                <!-- TODO: дизлайк — нужен эндпоинт на бэкенде -->
                <button class="action-btn" id="dislike-btn"><i class="ph ph-thumbs-down"></i></button>
                <button class="action-btn" id="share-btn"><i class="ph ph-share-network"></i> Поделиться</button>
            </div>
        </div>

        <!-- Описание -->
        <div class="description-box">
            <div class="stats" id="video-stats">0 просмотров</div>
            <p id="video-description">Описание видео...</p>
        </div>

        <!-- Комментарии -->
        <div class="comments-section">
            <div class="comments-header">Комментарии</div>

            <div class="add-comment">
                <div class="channel-avatar"></div>
                <input type="text" placeholder="Введите комментарий..." id="comment-input">
            </div>

            <div id="comments-list">
                <p style="color: #aaa;">Загрузка комментариев...</p>
            </div>
        </div>
    </div>

    <!-- ПРАВАЯ КОЛОНКА (Рекомендации) -->
    <div class="secondary-column">
        <h3 style="font-size: 16px; margin-bottom: 16px; font-weight: 500;">Похожие видео</h3>
        <div id="recommendations-list">
            <!-- Сюда JS вставит рекомендации -->
        </div>
    </div>
</div>

<!-- ================= СКРИПТЫ ДЛЯ СТРАНИЦЫ ВИДЕО ================= -->
<script>
    // tojson безопасно сериализует значение (не сломает скрипт, если video_id отсутствует)
    const videoId = {{ video_id | tojson }};
    // Относительные пути: страница и API на одном origin, работает и при деплое
    const API_URL = '';

    // ---------- Утилиты ----------

    // Защита от XSS: всё, что вставляется через innerHTML, экранируем
    function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, ch => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[ch]));
    }

    // Плюрализация: plural(5, 'подписчик', 'подписчика', 'подписчиков')
    function plural(n, one, few, many) {
        n = Math.abs(Number(n) || 0) % 100;
        const n1 = n % 10;
        if (n > 10 && n < 20) return many;
        if (n1 > 1 && n1 < 5) return few;
        if (n1 === 1) return one;
        return many;
    }

    function fmtDate(iso) {
        return iso ? new Date(iso).toLocaleDateString() : '';
    }

    function subsText(count) {
        count = count || 0;
        return `${count} ${plural(count, 'подписчик', 'подписчика', 'подписчиков')}`;
    }

    // 1. Загрузка данных о видео
    async function loadVideo() {
        try {
            const res = await fetch(`${API_URL}/videos/${videoId}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const v = await res.json();

            document.getElementById('video-title').textContent = v.title;
            document.getElementById('video-description').textContent = v.description || 'Нет описания';

            const views = v.views || 0;
            const viewsStr = `${views} ${plural(views, 'просмотр', 'просмотра', 'просмотров')}`;
            document.getElementById('video-stats').textContent =
                v.created_at ? `${viewsStr} • ${fmtDate(v.created_at)}` : viewsStr;

            document.getElementById('like-count').textContent = v.likes_count || 0;
            // Начальное состояние кнопки лайка (если API отдаёт liked_by_me)
            document.getElementById('like-btn').classList.toggle('active', !!v.liked_by_me);

            // Инфу о канале грузим параллельно, не блокируя плеер
            loadChannel(v.owner_id);

            const player = document.getElementById('video-player');
            if (v.file_path) {
                player.src = `${API_URL}${v.file_path}`;
            }
        } catch (e) {
            console.error('Ошибка загрузки видео:', e);
            document.getElementById('video-title').textContent = 'Ошибка загрузки видео';
        }
    }

    // 1.1. Загрузка информации о канале и кнопки подписки
    async function loadChannel(channelId) {
        const btn = document.getElementById('subscribe-btn');
        const subsEl = document.getElementById('channel-subs');
        const nameEl = document.getElementById('channel-name');
        const avatarEl = document.getElementById('channel-avatar');

        const token = localStorage.getItem('token'); // единый ключ токена по всему проекту
        const headers = token ? { 'Authorization': `Bearer ${token}` } : {};

        // По умолчанию кнопка видна; для анонима — предложение войти
        btn.style.display = 'inline-block';
        btn.classList.remove('subscribed');
        btn.textContent = 'Подписаться';
        btn.onclick = () => alert('Войдите, чтобы подписаться');

        try {
            // Имя канала и счётчик — публичная информация, грузим и без токена.
            // (Эндпоинт /subscriptions/channel/{id} должен пускать анонимов.)
            const r = await fetch(`${API_URL}/subscriptions/channel/${channelId}`, { headers });
            if (!r.ok) {
                console.error('Не удалось загрузить инфо о канале:', r.status);
                return;
            }
            const info = await r.json();

            const email = info.email || '';
            nameEl.textContent = email ? email.split('@')[0] : 'Автор';
            avatarEl.textContent = (email || 'U').charAt(0).toUpperCase();
            avatarEl.style.cssText = 'width:40px;height:40px;border-radius:50%;background:#c2185b;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;';
            subsEl.textContent = subsText(info.subscribers_count);

            if (info.is_own_channel) {
                btn.style.display = 'none';
                return;
            }

            const setSubscribed = (flag) => {
                btn.textContent = flag ? 'Вы подписаны' : 'Подписаться';
                btn.classList.toggle('subscribed', flag);
            };
            setSubscribed(!!info.is_subscribed);

            btn.onclick = async () => {
                if (!token) return alert('Войдите, чтобы подписаться');
                try {
                    const r2 = await fetch(`${API_URL}/subscriptions/${channelId}/toggle`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (!r2.ok) {
                        if (r2.status === 401) return alert('Войдите заново');
                        return alert('Не удалось изменить подписку');
                    }
                    const data = await r2.json();
                    setSubscribed(!!data.is_subscribed);
                    subsEl.textContent = subsText(data.subscribers_count);
                } catch (err) {
                    console.error('Ошибка подписки:', err);
                    alert('Ошибка сети');
                }
            };
        } catch (e) {
            console.error('Ошибка загрузки канала:', e);
        }
    }

    // 2. Загрузка комментариев
    async function loadComments() {
        const list = document.getElementById('comments-list');
        try {
            const res = await fetch(`${API_URL}/videos/${videoId}/comments`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const comments = await res.json();

            if (comments.length === 0) {
                list.innerHTML = '<p style="color: #aaa;">Комментариев пока нет.</p>';
                return;
            }

            list.innerHTML = comments.map(c => `
                <div class="comment-item">
                    <div class="channel-avatar"></div>
                    <div class="comment-content">
                        <div class="comment-header">
                            <span class="author">${escapeHtml(c.user_email)}</span>
                            <span class="date">${fmtDate(c.created_at)}</span>
                        </div>
                        <div class="comment-text">${escapeHtml(c.text)}</div>
                    </div>
                </div>
            `).join('');
        } catch (e) {
            console.error('Ошибка загрузки комментариев:', e);
            list.innerHTML = '<p style="color: #aaa;">Не удалось загрузить комментарии.</p>';
        }
    }

    // 3. Загрузка рекомендаций
    async function loadRecommendations() {
        const list = document.getElementById('recommendations-list');
        try {
            const res = await fetch(`${API_URL}/videos?exclude_id=${videoId}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const videos = await res.json();

            if (!videos.length) {
                list.innerHTML = '<p style="color: #aaa;">Пока нет других видео.</p>';
                return;
            }

            list.innerHTML = videos.map(v => {
                const views = v.views || 0;
                return `
                <a href="/video?id=${encodeURIComponent(v.id)}" class="recommendation-item">
                    <div class="thumbnail">
                        <img src="${escapeHtml(v.thumbnail_path || 'https://img.goodfon.ru/wallpaper/big/e/74/fon-seryi-gradient.webp')}" alt="">
                    </div>
                    <div class="rec-info">
                        <h4>${escapeHtml(v.title)}</h4>
                        <p>Автор #${escapeHtml(v.owner_id)}</p>
                        <p>${views} ${plural(views, 'просмотр', 'просмотра', 'просмотров')}</p>
                    </div>
                </a>`;
            }).join('');
        } catch (e) {
            console.error('Ошибка загрузки рекомендаций:', e);
            list.innerHTML = '<p style="color: #aaa;">Не удалось загрузить рекомендации.</p>';
        }
    }

    // 4. Отправка комментария
    const commentInput = document.getElementById('comment-input');
    let commentSending = false; // защита от двойной отправки

    commentInput.addEventListener('keydown', async (e) => {
        if (e.key !== 'Enter' || commentSending) return;
        const text = commentInput.value.trim();
        if (!text) return;

        const token = localStorage.getItem('token');
        if (!token) return alert('Чтобы оставить комментарий, нужно войти в аккаунт!');
        // NB: поле НЕ очищаем до успешной отправки — текст не потеряется при ошибке

        commentSending = true;
        try {
            const res = await fetch(`${API_URL}/videos/${videoId}/comments`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ text })
            });

            if (res.ok) {
                commentInput.value = ''; // очищаем только после успеха
                loadComments();
            } else {
                let detail = 'Не удалось отправить комментарий';
                try {
                    const err = await res.json();
                    if (typeof err.detail === 'string') detail = err.detail;
                } catch (_) { /* тело не JSON */ }
                alert(`Ошибка: ${detail}`);
            }
        } catch (err) {
            console.error('Ошибка отправки комментария:', err);
            alert('Ошибка сети');
        } finally {
            commentSending = false;
        }
    });

    // 5. Лайк
    document.getElementById('like-btn').addEventListener('click', async () => {
        const token = localStorage.getItem('token');
        if (!token) return alert('Войдите, чтобы поставить лайк');

        try {
            const res = await fetch(`${API_URL}/videos/${videoId}/like`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.ok) {
                const data = await res.json();
                document.getElementById('like-count').textContent = data.likes_count ?? 0;
                if (typeof data.liked_by_me === 'boolean') {
                    document.getElementById('like-btn').classList.toggle('active', data.liked_by_me);
                }
            } else if (res.status === 401) {
                alert('Вы не авторизованы (или токен истёк). Войдите заново.');
            } else {
                alert('Ошибка лайка.');
            }
        } catch (err) {
            console.error('Ошибка лайка:', err);
            alert('Ошибка сети');
        }
    });

    // 6. Поделиться — копируем ссылку на видео
    document.getElementById('share-btn').addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(window.location.href);
            alert('Ссылка скопирована в буфер обмена');
        } catch {
            prompt('Скопируйте ссылку:', window.location.href);
        }
    });

    // Запуск при загрузке
    document.addEventListener('DOMContentLoaded', () => {
        loadVideo();
        loadComments();
        loadRecommendations();
    });
</script>
{% endblock %}
